name: Deploy to Vercel
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --scope team_E1HSbARAkTSoOPfd13P7zsJA \
            --prod \
            --yes \
            --name mbs-alert
        env:
          VERCEL_ORG_ID: team_E1HSbARAkTSoOPfd13P7zsJA
